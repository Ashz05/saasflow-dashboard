version: "1.0"
project:
  name: "saasflow"
  type: "fullstack"

services:
  database:
    type: "postgres"
    port: 5432
    docker_compose_service: "postgres"

  backend:
    type: "fastapi"
    directory: "./backend"
    port: 8000
    start_command: "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    health_endpoint: "/health"

  frontend:
    type: "vite-react"
    directory: "./frontend"
    port: 5173
    start_command: "npm run dev"
